
# cf. https://wirelessthings.io/index.php/2023/01/31/telegraf-influxdb-grafana-with-docker-compose/
# cf. https://docs.influxdata.com/influxdb/v2/install/use-docker-compose/

services:
  influxdb2:
    image: influxdb:2
    container_name: influxdb2
    ports:
      - 8086:8086
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME_FILE: /run/secrets/influxdb2-admin-username
      DOCKER_INFLUXDB_INIT_PASSWORD_FILE: /run/secrets/influxdb2-admin-password 
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN_FILE: /run/secrets/influxdb2-admin-token
      DOCKER_INFLUXDB_INIT_ORG: mbdo 
      DOCKER_INFLUXDB_INIT_BUCKET: factory
    secrets:
      - influxdb2-admin-username
      - influxdb2-admin-password
      - influxdb2-admin-token
    volumes:
      - type: volume
        source: influxdb2-data
        target: /var/lib/influxdb2
      - type: volume
        source: influxdb2-config
        target: /etc/influxdb2
    healthcheck:
      test: "curl -f http://localhost:8086/ping"
      interval: 5s
      timeout: 10s
      retries: 5
  dt-support-gateway:
    image: registry.git.rwth-aachen.de/mbdo/mbdo-impl/dt-support-gateway:latest
    container_name: dt-support-gateway
    volumes:
        - ./services/gateway/config:/app/config
    # restart: unless-stopped
    extra_hosts:
        - "host.docker.internal:host-gateway"  # enable access to host via "host.docker.internal" url
        #- "host.docker.internal:172.17.0.1"
        
    depends_on:
      # Waits until influxdb container is up
      influxdb2:
        condition: service_healthy        
  grafana:
    image: grafana/grafana-oss:9.5.12
    container_name: grafana
    ports:
      - 3000:3000
    volumes:
      - type: volume
        source: grafana-data
        target: /var/lib/grafana
      # Make sure you create these local directories
      #- ./grafana/data:/var/lib/grafana
      - ./services/grafana/config:/etc/grafana
      - ./services/grafana/log:/var/log/grafana
    restart: unless-stopped
secrets:
    # on real system, the secrets should not be part of the config
    influxdb2-admin-username:
        file: ./services/influxdb/config/.env.influxdb2-admin-username
    influxdb2-admin-password:
        file: ./services/influxdb/config/.env.influxdb2-admin-password
    influxdb2-admin-token:
        file: ./services/influxdb/config/.env.influxdb2-admin-token

volumes:
  # volumes stored in docker 
  influxdb2-data:
  influxdb2-config:
  grafana-data:




        