# GatewayConfiguration for REN_1S1V_1C1V_1H1M_02 (gateway run locally with ./gradlew bootRun, see Flexible-replanning/MANUAL_LAUNCH.md)
#
# PLC topics:     PLC/<RevPi0x>/<Type>/<I1MachineId>/measurements/<input|output|internal>/<attribute>
# Twin topics:    gateway/REN_1S1V_1C1V_1H1M_02/<MachineModel>/<attribute>
# Machines:       RevPi01 = VGR1 + SL, RevPi02 = VGR2 + CB, RevPi03 = MPS + HB
# Generated by tools/generate_gateway_config.py from VIRTUAL_1C1H1M1S2V_01 (same attributes, REN PLC and
# machine ids): edit the virtual configuration or the generator, not this file.

configuration:
  name: "GatewayConfiguration"
  mqttSourceBrokerUrl: tcp://mbdo-server.local:1883
  mqttTargetBrokerUrl: tcp://mbdo-server.local:1883

  influxDBConfiguration:
      url: "http://localhost:8086"
      token: "MyInitialAdminToken0=="
      org: "mbdo"
      bucket: "factory"

  mqttInfluxdbRecordings: # MQTT to influxdb TimeSeries
    - name: "Physical_Twin_VGR_01"
      mqttSourceTopic: "PLC/RevPi01/VacuumGripper/I1VacuumGripper01/#"
      dataProcess: extract-json-value
      timeProcess: extract-json-timestamp
    - name: "Physical_Twin_VGR_02"
      mqttSourceTopic: "PLC/RevPi02/VacuumGripper/I1VacuumGripper02/#"
      dataProcess: extract-json-value
      timeProcess: extract-json-timestamp
    - name: "Physical_Twin_HB_01"
      mqttSourceTopic: "PLC/RevPi03/HighBay/I1HighBay01/#"
      dataProcess: extract-json-value
      timeProcess: extract-json-timestamp
    - name: "Physical_Twin_SL_01"
      mqttSourceTopic: "PLC/RevPi01/SortingLine/I1SortingLine01/#"
      dataProcess: extract-json-value
      timeProcess: extract-json-timestamp
    - name: "Physical_Twin_MP_01"
      mqttSourceTopic: "PLC/RevPi03/MultiProcessing/I1MultiProcessing01/#"
      dataProcess: extract-json-value
      timeProcess: extract-json-timestamp
    - name: "Physical_Twin_CB_01"
      mqttSourceTopic: "PLC/RevPi02/ConveyorBelt/I1ConveyorBelt01/#"
      dataProcess: extract-json-value
      timeProcess: extract-json-timestamp

  # Kafka disabled (no kafkaBrokerUrl): the list must stay present, even empty, or the gateway's
  # message handler fails on it for every MQTT message.
  mqttKafkaRecordings: []

  dtEventGroups:
  # define measures that should be forwarded to DT, use group to organize sources or when the processing is different
    
    # VacuumGripper 01:
    - name: "REN_1S1V_1C1V_1H1M_02/VGRSystemModel_01/input"
      dataTransformation: clone # copy the data
      mqttSourcePrefix: "PLC/RevPi01/VacuumGripper/I1VacuumGripper01/measurements/input/"
      mqttTargetPrefix: "gateway/"
      dtEvents:
        # map name of the data in the DT model and in the PT measure, mqttTargetTopic must match an element in the DT model 
        - mqttSourceTopic: "vacuumSensVerticalEncoderCounter"
          mqttTargetTopic: "REN_1S1V_1C1V_1H1M_02/VGRSystemModel_01/vacuumSensVerticalEncoderCounter"          
        - mqttSourceTopic: "vacuumSensRotEncoderCounter"
          mqttTargetTopic: "REN_1S1V_1C1V_1H1M_02/VGRSystemModel_01/vacuumSensRotEncoderCounter"
        - mqttSourceTopic: "vacuumSensArmEncoderCounter"
          mqttTargetTopic: "REN_1S1V_1C1V_1H1M_02/VGRSystemModel_01/vacuumSensArmEncoderCounter"
        - mqttSourceTopic: "vacuumSensVerticalEndUp"
