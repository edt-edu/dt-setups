        - type: rawMachineCommand
          id: "VGR2CloseToHBW"
          description: >
            [VGR2] Move arm close to HBW retrieval location
          placeholder: >
            {
                "topicName": "I1VacuumGripper02",
                "timestamp": 1751556715977,
                "message": {
                    "jsonType": "COMMAND",
                    "type": "VACUUM",
                    "outputId": "AUTO_ID",
                    "name": "ORDERED_GO_TO",
                    "parameters": [
                        {
                            "passableType": "POSITIONPARAMETERTHREED",
                            "passable": {
                                "meaning": "START",
                                "vertical": 210,
                                "horizontal": 0,
                                "rot": 1050
                            }
                        },
                        {
                            "passableType": "AXISPRIORITIZED",
                            "passable": {
                                "vertical": true,
                                "horizontal": false,
                                "rot": true
                            }
                        }
                    ]
                }
            }
          outputs:
            - Join1

        - type: join
          id: "Join1"
          description: >
            Join of HBPickup_1 and VGR2CloseToHBW
          outputs:
