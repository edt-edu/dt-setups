FactoryMissionsParallelized:
  name: "Factory missions parallelized"
  missions:
    - name: "VGR setup and CB moving"
      description: >
        Setup the vacuum gripper and forward the conveyor belt a few step
      nodes:
        - type: entryNode
          id: "Entry node"
          description: >
              The entry node
          outputs: 
            - Fork1

        - type: fork
          id: "Fork1"
          description: >
            The first Fork
          outputs:
            - ActionNode1
            - WaitAction

        - type: rawMachineCommand
          id: "ActionNode1"
          description: >
            Setup the VG1
          placeholder: >
            {
              "topicName": "VacuumGripper01",
              "timestamp": 1751547231773,
              "message": 
                {
                  "jsonType": "COMMAND",
                  "type": "VACUUM",
                  "outputId": "AUTO_ID",
                  "name": "SETUP",
                  "parameters": []
                }
            }
          outputs:
            - Join1

        - type: waitAction
          id: "WaitAction"
          description: >
            Wait for 10s
          time: 10
          outputs:
            - Join1

        - type: join
          id: "Join1"
          description: >
            The last join
          outputs:
            - ActionNode3
        
        - type: rawMachineCommand
          id: "ActionNode3"
          description: >
            Move back the CB
          placeholder: >
            {
              "topicName": "ConveyorBelt01",
              "timestamp": 1751547508462,
              "message": 
                {
                  "jsonType": "COMMAND",
                  "type": "CONVEYOR",
                  "outputId": "AUTO_ID",
                  "name": "MOVE_NB_STEPS",
                  "parameters": [
                      {
                          "passableType": "NUMBERNATURAL",
                          "passable": {
                              "number": 5
                          }
                      },
                      {
                          "passableType": "DIRECTION",
                          "passable": {
                              "direction": "BACKWARD"
                          }
                      }
                  ]
                }
            }
          outputs: []





    - name: "Sort_Process_Store_Mission"
      description: >
        Mission involving all machines.
        The sorting line sort the payload to red, then the vacuum gripper 1 take it to the conveyor.
        The conveyor move it forward and the vacuum gripper 2 take it to the multi processing station.
        Then the vacuum gripper move it to the highbay, which store it.
      nodes:
        - type: entryNode
          id: "Entry node"
          description: >
              Entry of mission
          outputs: 
            - Fork1

        - type: fork
          id: "Fork1"
          description: >
            HB retrieve and VGR2 to HBW
          outputs:
            - HBretrieve
            - VGR2toHBW

        - type: rawMachineCommand
          id: "HBretrieve"
          description: >
            Retrieve the box 1:1
          placeholder: >
            {
              "topicName": "HighBay01",
              "timestamp": 1750259441566,
              "message": {
                  "jsonType": "COMMAND",
                  "type": "WAREHOUSE",
                  "outputId": "AUTO_ID",
                  "name": "PICKUP_FROM",
                  "parameters": [
                      {
                          "passableType": "NUMBERNATURAL",
                          "passable": {
                              "number": 1
                          }
                      },
                      {
                          "passableType": "NUMBERNATURAL",
                          "passable": {
                              "number": 1
                          }
                      }
                  ]
              }
            }
          outputs:
            - Join1

        - type: rawMachineCommand
          id: "VGR2toHBW"
          description: >
            Move the VGR2 to HBW
          placeholder: >
            {
                "topicName": "VacuumGripper02",
                "timestamp": 1751556715977,
                "message": {
                    "jsonType": "COMMAND",
                    "type": "VACUUM",
                    "outputId": "AUTO_ID",
                    "name": "ORDERED_MOVE_TO",
                    "parameters": [
                        {
                            "passableType": "POSITIONPARAMETERTHREED",
                            "passable": {
                                "meaning": "START",
                                "vertical": 100,
                                "horizontal": 0,
                                "rot": 1050
                            }
                        },
                        {
                            "passableType": "AXISPRIORITIZED",
                            "passable": {
                                "vertical": true,
                                "horizontal": false,
                                "rot": true
                            }
                        }
                    ]
                }
            }
          outputs:
            - Join1

        - type: join
          id: "Join1"
          description: >
            Join of HB and VGR2
          outputs:
            - Fork2

        - type: fork
          id: "Fork2"
          description: >
            HB process and payload process
          outputs:
            - HBstore
            - VGR2toCB
        
        - type: rawMachineCommand
          id: "HBstore"
          description: >
            [HBW1] Store payload to place 1;1
          placeholder: >
            {
              "topicName": "HighBay01",
              "timestamp": 1750259441566,
              "message": {
                  "jsonType": "COMMAND",
                  "type": "WAREHOUSE",
                  "outputId": "AUTO_ID",
                  "name": "STORE_TO",
                  "parameters": [
                      {
                          "passableType": "NUMBERNATURAL",
                          "passable": {
                              "number": 1
                          }
                      },
                      {
                          "passableType": "NUMBERNATURAL",
                          "passable": {
                              "number": 1
                          }
                      }
                  ]
              }
            }
          outputs:
            - HBretrieve2
        
        - type: rawMachineCommand
          id: "HBretrieve2"
          description: >
            [HBW1] Retrieve box from place 1;1
          placeholder: >
            {
                "topicName": "HighBay01",
                "timestamp": 1750259441566,
                "message": {
                    "jsonType": "COMMAND",
                    "type": "WAREHOUSE",
                    "outputId": "AUTO_ID",
                    "name": "PICKUP_FROM",
                    "parameters": [
                        {
