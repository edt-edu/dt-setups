        #     [HBW1] Pickup the box at 1:1 and place it on retrieval location
        #   placeholder: >
        #     {
        #       "topicName": "I1HighBay01",
        #       "timestamp": 1750259441566,
        #       "message": {
        #           "jsonType": "COMMAND",
        #           "type": "WAREHOUSE",
        #           "outputId": "AUTO_ID",
        #           "name": "PICKUP_FROM",
        #           "parameters": [
        #               {
        #                   "passableType": "NUMBERNATURAL",
        #                   "passable": {
        #                       "number": 1
        #                   }
        #               },
        #               {
        #                   "passableType": "NUMBERNATURAL",
        #                   "passable": {
        #                       "number": 1
        #                   }
        #               }
        #           ]
        #       }
        #     }
        #   outputs:
