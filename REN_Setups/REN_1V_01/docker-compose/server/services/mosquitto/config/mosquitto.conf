persistence true
persistence_location /mosquitto/data/
log_type subscribe
log_type unsubscribe
log_type error
log_type warning
log_type notice
log_type information
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout


# MQTT Default listener
listener 1883 0.0.0.0
allow_anonymous true

# WebSocket
listener 9001 0.0.0.0
protocol websockets
