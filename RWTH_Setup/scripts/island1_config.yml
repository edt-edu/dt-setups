
# Configuration for VacuumGripperController
---
plc:
  id: "Island 1"
connection:
  # if host is commented, will default to "<hostname>.local"
  host: "0.0.0.0"
  # host: "RevPi103156.local"
  command_port: 6001
  notification_port: 6011
  # connectionListening: "controller" or "orchestrator"
  connectionListening: "controller"

controller:
  mainLoopDelay: 0.001

mqtt:
  server: "192.168.178.200"
  port: 1883
  keepalive: 60

# TODO write down remaining bindings from island1_main
machines:
  - name: "VacuumGripper01"
    type: "VACUUM"
    inputs:
      - field: "vacuumSensVerticalEndUp"
        port: "I_1"
      - field: "vacuumSensVerticalEncoderCounter"
        port: "Counter_5"
        counter: true
      - field: "vacuumSensRotEncoderCounter"
        port: "Counter_9"
        counter: true
        inverted: true
    outputs:
      - field: "vacuumActVerticalUp"
        port: "O_1"
