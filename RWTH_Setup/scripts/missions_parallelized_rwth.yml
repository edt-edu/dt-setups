FactoryMissionsParallelized:
  name: "Factory missions parallelized"
  missions:
    - name: Island1-Fetch-Sort-Process-and-Store
      description: >
        Fetches a payload from the HBW 1:1 and passes it through the SL. It'll be ejected as red and then passed to the 
        MPS. After processing it'll be stored back in the HBW at 1:1. 
        This mission is optimized for parallel execution.
      nodes:
        - type: entryNode
          id: start
          description: 'Start of the mission'
          outputs:
            - fork_mps_setup
        - type: fork
          id: fork_mps_setup
          description: 'Performs the MPS setup parallel to the other processing'
          outputs:
            - fork_vgr2_setup
            - mps_setup
        - type: fork
          id: fork_vgr2_setup
          description: 'Performs the VGR2 setup parallel to the other processing'
          outputs:
            - fork_fetch
            - vgr2_setup
        - type: fork
          id: fork_fetch
          description: 'Fetches the payload while moving VGR1 into position'
          outputs:
            - hbw_fetch
            - vgr1_setup
        - type: rawMachineCommand
          id: hbw_fetch
          description: 'Fetch a payload from 1:1'
          placeholder: >
            {
              "topicName": "I1HighBay01",
              "timestamp": 0,
              "message": {
                "jsonType": "COMMAND",
                "type": "WAREHOUSE",
                "outputId": "AUTO_ID",
                "name": "PICKUP_FROM",
                "parameters": [
                  {
                    "passableType": "NUMBERNATURAL",
                    "passable": {
                      "number": 1
                    }
                  },
                  {
                    "passableType": "NUMBERNATURAL",
                    "passable": {
                      "number": 1
                    }
                  }
                ]
              }
            }
          outputs:
            - join_fetch
        - type: rawMachineCommand
          id: vgr1_setup
          description: '[VGR1] Setup for improved precision'
          placeholder: >
            {
              "topicName": "I1VacuumGripper01",
              "timestamp": 0,
              "message": {
                "jsonType": "COMMAND",
                "type": "VACUUM",
                "outputId": "AUTO_ID",
                "name": "SETUP",
                "parameters": []
              }
            }
          outputs:
            - vgr1_over_hbw
        - type: rawMachineCommand
          id: vgr1_over_hbw
          description: 'Move VGR1 over the HBW'
          placeholder: >
            {
              "topicName": "I1VacuumGripper01",
              "timestamp": 0,
              "message": {
                "jsonType": "COMMAND",
                "type": "VACUUM",
                "outputId": "AUTO_ID",
                "name": "ORDERED_MOVE_TO",
                "parameters": [
                  {
                    "passableType": "NAMEDPOSITION",
                    "passable": {
                      "name": "OVER_HBW"
                    }
                  },
                  {
                    "passableType": "AXISPRIORITIZED",
                    "passable": {
                      "vertical": false,
                      "horizontal": false,
                      "rot": true
                    }
                  }
                ]
              }
            }
          outputs:
            - join_fetch
        - type: join
          id: join_fetch
          description: 'Join HBW and VGR1 after fetching the payload'
          outputs:
            - vgr1_move_from_hbw_to_cb
        - type: rawMachineCommand
          id: vgr1_move_from_hbw_to_cb
          description: '[VGR1] Move payload from HBW to CB'
          placeholder: >
            {
              "topicName": "I1VacuumGripper01",
              "timestamp": 0,
              "message": {
                "jsonType": "COMMAND",
                "type": "VACUUM",
                "outputId": "AUTO_ID",
                "name": "MOVE",
                "parameters": [
                  {
                    "passableType": "NAMEDPOSITION",
                    "passable": {
                      "name": "HBW"
                    }
                  },
                  {
                    "passableType": "NAMEDPOSITION",
                    "passable": {
                      "name": "CB"
                    }
                  }
                ]
              }
            }
          outputs:
            - fork_cb
        - type: fork
          id: fork_cb
          description: 'Move the payload while preparing VGR1 for pickup'
          outputs:
            - cb_to_vgr2
            - vgr1_over_cb
        - type: rawMachineCommand
          id: cb_to_vgr2
          description: '[CB] Move payload in reach of VGR2'
          placeholder: >
            {
              "topicName": "I1ConveyorBelt01",
              "timestamp": 0,
              "message": {
                "jsonType": "COMMAND",
                "type": "CONVEYOR",
                "outputId": "AUTO_ID",
                "name": "MOVE_TO_SENSOR",
                "parameters": [
                  {
                    "passableType": "DIRECTION",
                    "passable": {
                      "direction": "BACKWARD"
                    }
                  }
                ]
              }
            }
          outputs:
            - join_cb
        - type: rawMachineCommand
          id: vgr1_over_cb
          description: '[VGR1] Hover over the CB'
          placeholder: >
            {
              "topicName": "I1VacuumGripper01",
              "timestamp": 0,
              "message": {
                "jsonType": "COMMAND",
                "type": "VACUUM",
                "outputId": "AUTO_ID",
                "name": "GO_TO_POSITION",
                "parameters": [
                  {
                    "passableType": "NAMEDPOSITION",
                    "passable": {
                      "name": "OVER_CB"
                    }
                  }
                ]
              }
            }
          outputs:
            - join_cb
        - type: join
          id: join_cb
          description: 'Ensure that payload is at CB pickup point of VGR2 before continuing'
          outputs:
            - join_vgr2_setup
        - type: rawMachineCommand
          id: vgr2_setup
          description: "[VGR2] Setup for better precision"
          placeholder: >
            {
              "topicName": "I1VacuumGripper02",
              "timestamp": 0,
              "message": {
                "jsonType": "COMMAND",
                "type": "VACUUM",
                "outputId": "AUTO_ID",
                "name": "SETUP",
                "parameters": []
              }
            }
          outputs:
            - vgr2_over_cb
        - type: rawMachineCommand
          id: vgr2_over_cb
          description: '[VGR2] Move VGR2 over the CB in anticipation of the payload'
          placeholder: >
            {
              "topicName": "I1VacuumGripper02",
              "timestamp": 0,
              "message": {
                "jsonType": "COMMAND",
                "type": "VACUUM",
                "outputId": "AUTO_ID",
                "name": "GO_TO_POSITION",
                "parameters": [
                  {
                    "passableType": "NAMEDPOSITION",
                    "passable": {
                      "name": "OVER_CB"
                    }
                  }
                ]
              }
            }
          outputs:
            - join_vgr2_setup
        - type: join
          id: join_vgr2_setup
          description: 'Ensure VGR2 is setup before continuing'
          outputs:
            - vgr2_move_from_cb_to_sl_input
        - type: rawMachineCommand
          id: vgr2_move_from_cb_to_sl_input
          description: '[VGR2] Move payload from CB to SL input'
          placeholder: >
            {
              "topicName": "I1VacuumGripper02",
              "timestamp": 0,
              "message": {
                "jsonType": "COMMAND",
                "type": "VACUUM",
                "outputId": "AUTO_ID",
                "name": "MOVE",
                "parameters": [
                  {
                    "passableType": "NAMEDPOSITION",
                    "passable": {
                      "name": "CB"
                    }
                  },
                  {
                    "passableType": "NAMEDPOSITION",
                    "passable": {
                      "name": "SL_INPUT"
                    }
                  }
                ]
              }
            }
          outputs:
            - fork_sort
        - type: fork
          id: fork_sort
          description: 'Sort the payload while moving VGR2 into position'
          outputs:
            - sl_sort
            - vgr2_recalibration
        - type: rawMachineCommand
          id: sl_sort
          description: '[SL] Eject the payload at red'
          placeholder: >
            {
              "topicName": "I1SortingLine01",
              "timestamp": 0,
              "message": {
                "jsonType": "COMMAND",
                "type": "SORTING",
                "outputId": "AUTO_ID",
                "name": "EJECT",
                "parameters": [
                  {
                    "passableType": "COLOR",
                    "passable": {
                      "color": "RED"
                    }
                  }
                ]
              }
            }
          outputs:
            - join_sort
        - type: rawMachineCommand
          id: vgr2_recalibration
          description: '[VGR2] Perform a setup for better precision'
          placeholder: >
            {
              "topicName": "I1VacuumGripper02",
              "timestamp": 0,
              "message": {
                "jsonType": "COMMAND",
                "type": "VACUUM",
                "outputId": "AUTO_ID",
                "name": "SETUP",
                "parameters": []
              }
            }
          outputs:
            - vgr2_goto_over_sl_output_red
        - type: rawMachineCommand
          id: vgr2_goto_over_sl_output_red
          description: '[VGR2] Hover over the red SL output'
          placeholder: >
            {
              "topicName": "I1VacuumGripper02",
              "timestamp": 0,
              "message": {
                "jsonType": "COMMAND",
                "type": "VACUUM",
                "outputId": "AUTO_ID",
                "name": "GO_TO_POSITION",
                "parameters": [
                  {
                    "passableType": "NAMEDPOSITION",
                    "passable": {
                      "name": "OVER_SL_OUTPUT_RED"
                    }
                  }
                ]
              }
            }
          outputs:
            - join_sort
        - type: join
          id: join_sort
          description: 'Wait until the sorting process is done and VGR2 is ready for pickup'
          outputs:
            - vgr2_move_from_sl_out_red_to_cb
        - type: rawMachineCommand
          id: vgr2_move_from_sl_out_red_to_cb
          description: '[VGR2] Move payload from red SL output to CB'
          placeholder: >
            {
              "topicName": "I1VacuumGripper02",
              "timestamp": 0,
              "message": {
                "jsonType": "COMMAND",
                "type": "VACUUM",
                "outputId": "AUTO_ID",
                "name": "MOVE",
                "parameters": [
                  {
                    "passableType": "NAMEDPOSITION",
                    "passable": {
                      "name": "SL_OUTPUT_RED"
                    }
                  },
                  {
                    "passableType": "NAMEDPOSITION",
                    "passable": {
                      "name": "CB"
                    }
                  }
                ]
              }
            }
          outputs:
            - cb_to_vgr1
        - type: rawMachineCommand
          id: cb_to_vgr1
          description: '[CB] Move payload in reach of VGR1'
          placeholder: >
            {
              "topicName": "I1ConveyorBelt01",
              "timestamp": 0,
              "message": {
                "jsonType": "COMMAND",
                "type": "CONVEYOR",
                "outputId": "AUTO_ID",
                "name": "MOVE_TO_SENSOR",
                "parameters": [
                  {
                    "passableType": "DIRECTION",
                    "passable": {
                      "direction": "FORWARD"
                    }
                  }
                ]
              }
            }
          outputs:
            - join_mps_setup
        - type: rawMachineCommand
          id: mps_setup
          description: '[MPS] Setup'
          placeholder: >
            {
              "topicName": "I1MultiProcessing01",
              "timestamp": 0,
              "message": {
                "jsonType": "COMMAND",
                "type": "MULTIPROCESSING",
                "outputId": "AUTO_ID",
                "name": "SETUP",
                "parameters": []
              }
            }
          outputs:
            - join_mps_setup
        - type: join
          id: join_mps_setup
          description: 'Ensure MPS is setup before continuing'
          outputs:
            - vgr1_move_from_cb_to_mps_input
        - type: rawMachineCommand
          id: vgr1_move_from_cb_to_mps_input
          description: '[VGR1] Move payload from CB to MPS input'
          placeholder: >
            {
              "topicName": "I1VacuumGripper01",
              "timestamp": 0,
              "message": {
                "jsonType": "COMMAND",
                "type": "VACUUM",
                "outputId": "AUTO_ID",
                "name": "MOVE",
                "parameters": [
                  {
                    "passableType": "NAMEDPOSITION",
                    "passable": {
                      "name": "CB"
                    }
                  },
                  {
                    "passableType": "NAMEDPOSITION",
                    "passable": {
                      "name": "MPS_INPUT"
                    }
                  }
                ]
              }
            }
          outputs:
            - fork_mps_process
        - type: fork
          id: fork_mps_process
          description: 'Process the payload while moving VGR1 out of the way'
          outputs:
            - mps_process
            - vgr1_goto_safety
        - type: rawMachineCommand
          id: mps_process
          description: '[MPS] Process the payload'
          placeholder: >
            {
              "topicName": "I1MultiProcessing01",
              "timestamp": 0,
              "message": {
                "jsonType": "COMMAND",
                "type": "MULTIPROCESSING",
                "outputId": "AUTO_ID",
                "name": "PROCESS",
                "parameters": [
                  {
                    "passableType": "NUMBERNATURAL",
                    "passable": {
                      "number": 2
                    }
                  },
                  {
                    "passableType": "NUMBERNATURAL",
                    "passable": {
                      "number": 2
                    }
                  },
                  {
                    "passableType": "MPSOUTPUT",
                    "passable": {
                      "output": "CONVEYOR"
                    }
                  }
                ]
              }
            }
          outputs:
            - join_mps_process
        - type: rawMachineCommand
          id: vgr1_goto_safety
          description: '[VGR1] Goto the safety position'
          placeholder: >
            {
              "topicName": "I1VacuumGripper01",
              "timestamp": 0,
              "message": {
                "jsonType": "COMMAND",
                "type": "VACUUM",
                "outputId": "AUTO_ID",
                "name": "MOVE_TO_SAFE_POSITION",
                "parameters": []
              }
            }
          outputs:
            - join_mps_process
        - type: join
          id: join_mps_process
          description: 'Wait until the MPS process is done'
          outputs:
            - fork_transfer_to_hbw
        - type: fork
          id: fork_transfer_to_hbw
          description: 'Transfer the payload to HBW while moving the MPS arm out of the way'
          outputs:
            - mps_arm_to_oven
            - vgr1_move_from_mps_output_to_hbw
        - type: rawMachineCommand
          id: mps_arm_to_oven
          description: '[MPS] Move the arm to the oven'
          placeholder: >
            {
              "topicName": "I1MultiProcessing01",
              "timestamp": 0,
              "message": {
                "jsonType": "COMMAND",
                "type": "MULTIPROCESSING",
                "outputId": "AUTO_ID",
                "name": "ARM_MOVE",
                "parameters": [
                  {
                    "passableType": "MPSARMPOSITION",
                    "passable": {
                      "destination": "OVEN"
                    }
                  }
                ]
              }
            }
          outputs:
            - join_transfer_to_hbw
        - type: rawMachineCommand
          id: vgr1_move_from_mps_output_to_hbw
          description: '[VGR1] Move payload from MPS output to HBW'
          placeholder: >
            {
              "topicName": "I1VacuumGripper01",
              "timestamp": 0,
              "message": {
                "jsonType": "COMMAND",
                "type": "VACUUM",
                "outputId": "AUTO_ID",
                "name": "MOVE",
                "parameters": [
                  {
                    "passableType": "NAMEDPOSITION",
                    "passable": {
                      "name": "MPS_OUTPUT"
                    }
                  },
                  {
                    "passableType": "NAMEDPOSITION",
                    "passable": {
                      "name": "HBW"
                    }
                  }
                ]
              }
            }
          outputs:
            - join_transfer_to_hbw
        - type: join
          id: join_transfer_to_hbw
          description: 'Wait until the payload has been placed in the HBW input (a cup was already present)'
          outputs:
            - fork_store
        - type: fork
          id: fork_store
          description: 'Store the payload while moving the MPS arm back to the turn table'
          outputs:
            - hbw_store
            - mps_arm_to_tt
        - type: rawMachineCommand
          id: hbw_store
          description: '[HBW] Store the payload at 1:1'
          placeholder: >
            {
              "topicName": "I1HighBay01",
              "timestamp": 0,
              "message": {
                "jsonType": "COMMAND",
                "type": "WAREHOUSE",
                "outputId": "AUTO_ID",
                "name": "STORE_TO",
                "parameters": [
                  {
                    "passableType": "NUMBERNATURAL",
                    "passable": {
                      "number": 1
                    }
                  },
                  {
                    "passableType": "NUMBERNATURAL",
                    "passable": {
                      "number": 1
                    }
                  }
                ]
              }
            }
          outputs:
            - join_store
        - type: rawMachineCommand
          id: mps_arm_to_tt
          description: '[MPS] Move the arm to the turntable'
          placeholder: >
            {
              "topicName": "I1MultiProcessing01",
              "timestamp": 0,
              "message": {
                "jsonType": "COMMAND",
                "type": "MULTIPROCESSING",
                "outputId": "AUTO_ID",
                "name": "ARM_MOVE",
                "parameters": [
                  {
                    "passableType": "MPSARMPOSITION",
                    "passable": {
                      "destination": "TURNTABLE"
                    }
                  }
                ]
              }
            }
          outputs:
            - join_store
        - type: join
          id: join_store
          description: 'Wait until the payload has been stored'
          outputs: []

    - name: "Island1-Sort_Process_Store_Mission"
      description: >
        A payload is fetched from HBW 1:1 and passed by VGR2 over the CB to VGR1 where it is placed on the SL input.
        The SL will sort the payload to red and it will be passed back over the CB to the MPS. 
        After processing it will be returned to HBW 1:1.
        This is a clone of the Sort_Process_Store_Mission in the Rennes setup, adjusted for RWTH setup.
      nodes:
        - type: entryNode
          id: "Start"
          description: >
            Start of the mission.
          outputs:
            - MPSSetup

        - type: rawMachineCommand
          id: "MPSSetup"
          description: >
            Perform an MPS setup
          placeholder: >
            {
                "topicName": "I1MultiProcessing01",
                "timestamp": 1750259348009,
                "message": {
                    "jsonType": "COMMAND",
                    "type": "MULTIPROCESSING",
                    "outputId": "AUTO_ID",
                    "name": "SETUP",
                    "parameters": []
                }
            }
          outputs:
            - Fork1

        - type: fork
          id: "Fork1"
          description: >
            HB retrieve and VGR1 to HBW
          outputs:
            - HBPickup_1
            - VGR1CloseToHBW

        - type: rawMachineCommand
          id: "HBPickup_1"
          description: >
            [HBW] Pickup the box at 1:1 and place it on retrieval location
          placeholder: >
            {
              "topicName": "I1HighBay01",
              "timestamp": 1750259441566,
              "message": {
                  "jsonType": "COMMAND",
                  "type": "WAREHOUSE",
                  "outputId": "AUTO_ID",
                  "name": "PICKUP_FROM",
                  "parameters": [
                      {
                          "passableType": "NUMBERNATURAL",
                          "passable": {
                              "number": 1
                          }
                      },
                      {
                          "passableType": "NUMBERNATURAL",
                          "passable": {
                              "number": 1
                          }
                      }
                  ]
              }
            }
          outputs:
            - Join1

        - type: rawMachineCommand
          id: "VGR1CloseToHBW"
          description: >
            [VGR1] Move arm close to HBW retrieval location
          placeholder: >
            {
                "topicName": "I1VacuumGripper01",
                "timestamp": 1751556715977,
                "message": {
                    "jsonType": "COMMAND",
                    "type": "VACUUM",
                    "outputId": "AUTO_ID",
                    "name": "ORDERED_MOVE_TO",
                    "parameters": [
                        {
                            "passableType": "POSITIONPARAMETERTHREED",
                            "passable": {
                                "meaning": "START",
                                "vertical": 100,
                                "horizontal": 0,
                                "rot": 2500
                            }
                        },
                        {
                            "passableType": "AXISPRIORITIZED",
                            "passable": {
                                "vertical": false,
                                "horizontal": false,
                                "rot": true
                            }
                        }
                    ]
                }
            }
          outputs:
            - Join1

        - type: join
          id: "Join1"
          description: >
            Join of HBPickup_1 and VGR1CloseToHBW
          outputs:
            - Fork2

        - type: fork
          id: "Fork2"
          description: >
            HB process and payload process
          outputs:
            - HBStoreTo_1
            - VGR1toCB

        - type: rawMachineCommand
          id: "HBStoreTo_1"
          description: >
            [HBW] Store empty box from retrieval location to place 1;1
          placeholder: >
            {
              "topicName": "I1HighBay01",
              "timestamp": 1750259441566,
              "message": {
                  "jsonType": "COMMAND",
                  "type": "WAREHOUSE",
                  "outputId": "AUTO_ID",
                  "name": "STORE_TO",
                  "parameters": [
                      {
                          "passableType": "NUMBERNATURAL",
                          "passable": {
                              "number": 1
                          }
                      },
                      {
                          "passableType": "NUMBERNATURAL",
                          "passable": {
                              "number": 1
                          }
                      }
                  ]
              }
            }
          outputs:
            - HBPickup_2

        - type: rawMachineCommand
          id: "HBPickup_2"
          description: >
            [HBW] Pickup the empty box at 1:1 and place it on retrieval location
          placeholder: >
            {
                "topicName": "I1HighBay01",
                "timestamp": 1750259441566,
                "message": {
                    "jsonType": "COMMAND",
                    "type": "WAREHOUSE",
                    "outputId": "AUTO_ID",
                    "name": "PICKUP_FROM",
                    "parameters": [
                        {
                            "passableType": "NUMBERNATURAL",
                            "passable": {
                                "number": 1
                            }
                        },
                        {
                            "passableType": "NUMBERNATURAL",
                            "passable": {
                                "number": 1
                            }
                        }
                    ]
                }
              }
          outputs:
            - Join5

        - type: rawMachineCommand
          id: "VGR1toCB"
          description: >
            [VGR1] Move from HBW to CB
          placeholder: >
            {
                "topicName": "I1VacuumGripper01",
                "timestamp": 1750259239375,
                "message": {
                    "jsonType": "COMMAND",
                    "type": "VACUUM",
                    "outputId": "AUTO_ID",
                    "name": "MOVE",
                    "parameters": [
                        {
                            "passableType": "POSITIONPARAMETERTHREED",
                            "passable": {
                                "meaning": "START",
                                "vertical": 400,
                                "horizontal": 1005,
                                "rot": 2500
                            }
                        },
                        {
                            "passableType": "POSITIONPARAMETERTHREED",
                            "passable": {
                                "meaning": "END",
                                "vertical": 1300,
                                "horizontal": 1850,
                                "rot": 1130
                            }
                        }
                    ]
                }
              }
          outputs:
            - Fork3

        - type: fork
          id: "Fork3"
          description: >
            CB move and VGR1 retract
          outputs:
            - CBmove
            - VGR1retract

        - type: rawMachineCommand
          id: "CBmove"
          description: >
            [CB] Move to left sensor
          placeholder: >
            {
                "topicName" : "I1ConveyorBelt01",
                "timestamp" : 0,
                "message" : {
                  "jsonType" : "COMMAND",
                  "type" : "CONVEYOR",
                  "outputId" : "AUTO_ID",
                  "name": "MOVE_TO_SENSOR",
                  "parameters": [
                      {
                          "passableType": "DIRECTION",
                          "passable": {
                              "direction": "BACKWARD"
                          }
                      }
                  ]
                }
              }
          outputs:
            - Join2

        - type: rawMachineCommand
          id: "VGR1retract"
          description: >
            [VGR1] Retract arm
          placeholder: >
            {
                "topicName": "I1VacuumGripper01",
                "timestamp": 1750322931414,
                "message": {
                    "jsonType": "COMMAND",
                    "type": "VACUUM",
                    "outputId": "AUTO_ID",
                    "name": "RETRACT_ARM",
                    "parameters": []
                }
              }
          outputs:
            - Join2

        - type: join
