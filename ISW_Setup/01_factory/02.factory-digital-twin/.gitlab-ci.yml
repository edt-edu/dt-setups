image: maven:3.8.6-openjdk-17

stages:
  - build
  - test

cache:
  paths:
    - .m2/repository/

before_script:
  - cd dts

build:
  stage: build
  script:
    - mvn clean package
  artifacts:
    paths:
      - target/*.jar  # Store the generated JAR files

test:
  stage: test
  script:
    - mvn test  # Run tests