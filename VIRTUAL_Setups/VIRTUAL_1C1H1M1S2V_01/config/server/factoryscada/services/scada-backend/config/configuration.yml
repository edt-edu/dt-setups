# Configuration (00)

configuration:
  name: "VIRTUAL_1C1H1M1S2V_01_configuration"

  controllers:
    - name: "virtualmachines-plc-1"
      host: 'localhost'
      commandPort: 6001
      notificationPort: 6011
      machines:
        - type: "conveyorBelt"
          name: "ConveyorBelt01"

        - type: "highBayWarehouse"
          name: "HighBay01"   

        - type: "multiProcessingStation"
          name: "MultiProcessing01"
        
        - type: "sortingLine"
          name: "SortingLine01"

        - type: "vacuumGripper"
          name: "VacuumGripper01"

        - type: "vacuumGripper"
          name: "VacuumGripper02"

  # Logical names used by the backend mission extensions, mapped to this setup's machines.
  machineNameMappings:
    - logicalName: "DynamicMission/Demo/SL"
      machineName: "SortingLine01"
    - logicalName: "DynamicMission/Demo/VGR1"
      machineName: "VacuumGripper01"
    - logicalName: "DynamicMission/Demo/VGR2"
      machineName: "VacuumGripper02"
    - logicalName: "DynamicMission/Demo/CB"
      machineName: "ConveyorBelt01"
    - logicalName: "DynamicMission/Demo/MPS"
      machineName: "MultiProcessing01"
    - logicalName: "REN_MISSION_01/SL01"
      machineName: "SortingLine01"
    - logicalName: "REN_MISSION_01/VGR01"
      machineName: "VacuumGripper01"
    - logicalName: "REN_MISSION_01/VGR02"
      machineName: "VacuumGripper02"
    - logicalName: "REN_MISSION_01/CB01"
      machineName: "ConveyorBelt01"
    - logicalName: "REN_MISSION_01/MPS01"
      machineName: "MultiProcessing01"
