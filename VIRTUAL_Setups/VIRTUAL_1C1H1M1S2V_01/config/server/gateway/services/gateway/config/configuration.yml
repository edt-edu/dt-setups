      mqttSourcePrefix: "PLC/virtualmachines-plc-1/VacuumGripper/VacuumGripper01/measurements/input/"
      mqttTargetPrefix: "gateway/"
      dtEvents:
        # map name of the data in the DT model and in the PT measure, mqttTargetTopic must match an element in the DT model 
