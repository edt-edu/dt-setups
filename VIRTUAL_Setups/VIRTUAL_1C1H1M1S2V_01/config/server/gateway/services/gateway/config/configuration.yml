# GatewayConfiguration

configuration:
  name: "GatewayConfiguration"
  mqttSourceBrokerUrl: tcp://localhost:1883
  mqttTargetBrokerUrl: tcp://localhost:1883
  # kafkaBrokerUrl: PLAINTEXT://localhost:9092

  influxDBConfiguration:
      url: "http://localhost:8086"
      token: "MyInitialAdminToken0=="
      org: "mbdo"
      bucket: "factory"

  mqttInfluxdbRecordings: # MQTT to influxdb TimeSeries
  # define measures that should be collected in time series DB
    - name: "Physical_Twin_VGR_01"
      mqttSourceTopic: "PLC/virtualmachines-plc-1/VacuumGripper/VacuumGripper01/#"
      dataProcess: extract-json-value # json containing a primitive value field (othewise use "raw" or "extract-json-value-json-timestamp")
      timeProcess: extract-json-timestamp #  use time extracted from json timestamp field (otherwise use system time)    
    - name: "Physical_Twin_VGR_02"
      mqttSourceTopic: "PLC/virtualmachines-plc-1/VacuumGripper/VacuumGripper02/#"
      dataProcess: extract-json-value # json containing a primitive value field (othewise use "raw" or "extract-json-value-json-timestamp")
      timeProcess: extract-json-timestamp #  use time extracted from json timestamp field (otherwise use system time)    
    - name: "Physical_Twin_HB_01"
      mqttSourceTopic: "PLC/virtualmachines-plc-1/HighBay/HighBay01/#"
      dataProcess: extract-json-value
      timeProcess: extract-json-timestamp
    - name: "Physical_Twin_SL_01"
      mqttSourceTopic: "PLC/virtualmachines-plc-1/SortingLine/SortingLine01/#"
      dataProcess: extract-json-value
      timeProcess: extract-json-timestamp
    - name: "Physical_Twin_MP_01"
      mqttSourceTopic: "PLC/virtualmachines-plc-1/MultiProcessing/MultiProcessing01/#"
      dataProcess: extract-json-value
      timeProcess: extract-json-timestamp
    - name: "Physical_Twin_CB_01"
      mqttSourceTopic: "PLC/virtualmachines-plc-1/ConveyorBelt/ConveyorBelt01/#"
      dataProcess: extract-json-value
      timeProcess: extract-json-timestamp
    - name: "Physical_Twin_PM_01"
      mqttSourceTopic: "PLC/virtualmachines-plc-1/PunchingMachine/PunchingMachine01/#"
      dataProcess: extract-json-value
      timeProcess: extract-json-timestamp

    # - name: "Digital_Twin_VGR1"
    #   mqttSourceTopic: "gateway/VIRTUAL_1C1H1M1S2V_01/VGRSystemModel_01/#"
    #   dataProcess: extract-json-value # json containing a primitive value field (othewise use "raw")
    #   timeProcess: extract-json-timestamp  #  use time extracted from json timestamp field (otherwise use system time)
  
